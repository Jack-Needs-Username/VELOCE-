name: Refresh Veloce Real Data Cache

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Refresh source cache
        run: ruby scripts/refresh-real-data-cache.rb

      - name: Commit updated cache
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh Veloce real data cache"
          file_pattern: data/digest-cache.json data/auction-cache.json
